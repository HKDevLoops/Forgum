# Forgum CI
# Runs on every push and PR.
#
# Three layers:
#   Layer 1 — Code (blocks merge):  build/test, clippy, fmt, cfg-grep, audit,
#                                     pester, version-parity,
#                                     contributor-standards-gate.
#   Layer 2 — Integration (blocks merge): shell-hooks, daemon-lifecycle,
#                                          terminal-capabilities.
#   Layer 3 — Packaging (blocks RELEASE only, NOT merge): deb, rpm, msi, nix,
#                                                          pacman, choco.
#                                          These run on push/PR to catch breakage
#                                          early but are non-merge-blocking here
#                                          (continue-on-error: true) because only
#                                          the release flow gates on them.

name: CI

on:
  push:
    branches: [main, nightly, dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read
  actions: read

jobs:
  # =====================================================================
  # Layer 1 — Code (blocks merge)
  # =====================================================================

  rust-build-test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check
      - name: CLI Discovery & Options Verification
        run: |
          cargo run -p forgum-engine --bin forgum -- --version
          cargo run -p forgum-engine --bin forgum -- --help
          cargo run -p forgum-engine --bin forgum -- list
          cargo run -p forgum-engine --bin forgum -- --animal list
          cargo run -p forgum-engine --bin forgum -- --effect list
          cargo run -p forgum-engine --bin forgum -- --mountain list
          cargo run -p forgum-engine --bin forgum -- --road list
          cargo run -p forgum-engine --bin forgum -- --env list
          cargo run -p forgum-engine --bin forgum -- completions list
          cargo run -p forgum-engine --bin forgum -- config list

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Enforce minimum coverage threshold
        run: |
          TOTAL=$(grep -c '^DA:' coverage.lcov || echo 0)
          HITS=$(grep '^DA:' coverage.lcov | grep -v ',0$' | wc -l || echo 0)
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::No coverage data found"
            exit 0
          fi
          PCT=$((HITS * 100 / TOTAL))
          echo "Coverage: $HITS/$TOTAL lines = ${PCT}%"
          if [ "$PCT" -lt 30 ]; then
            echo "::error::Coverage ${PCT}% is below 30% minimum threshold"
            exit 1
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.lcov

  msrv:
    name: MSRV (1.75.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace compiles on MSRV
        run: cargo check --workspace

  cfg-grep:
    name: Platform cfg isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for platform cfg in engine source
        run: |
          HITS=$(grep -rn '#\[cfg(unix)\]\|cfg!(unix)\|#\[cfg(windows)\]\|cfg!(windows)\|#\[cfg(target_os\|cfg!(target_os\|#\[cfg(target_family\|cfg!(target_family' crates/engine/src/ || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: engine/src/ contains platform-targeting #[cfg] attributes."
            echo "All platform branching must live in forgum-platform."
            echo "$HITS"
            exit 1
          fi
          echo "OK: no platform cfg in engine source."


  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine
        run: cargo build --workspace
      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $results = Invoke-Pester -Path Tests/ -PassThru
          if ($results.FailedCount -gt 0) {
            Write-Error "Pester: $($results.FailedCount) test(s) failed."
            exit 1
          }

  cargo-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit

  version-parity:
    name: Version parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version parity across all manifests
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          BASE_VER=$(echo "$VERSION" | sed 's/-.*//')
          if [ -z "$VERSION" ]; then
            echo "ERROR: No version field found in Cargo.toml."
            exit 1
          fi
          echo "Cargo.toml version: $VERSION (base: $BASE_VER)"
          ERRORS=0

          # 1. Check Homebrew formula
          HB_VER=$(grep -m1 'version' packaging/homebrew/forgum.rb | sed 's/.*"\(.*\)".*/\1/')
          if [ "$HB_VER" != "$VERSION" ]; then
            echo "ERROR: Homebrew formula version ($HB_VER) != Cargo.toml ($VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          # 2. Check winget manifest
          WINGET_VER=$(grep 'PackageVersion:' packaging/winget/HKDevLoops.Forgum.yaml | head -1 | awk '{print $2}')
          if [ "$WINGET_VER" != "$VERSION" ]; then
            echo "ERROR: winget manifest version ($WINGET_VER) != Cargo.toml ($VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          # 3. Check RPM spec (RPM forbids hyphens in Version tag; prereleases use base version + Release tag)
          RPM_VER=$(grep '^Version:' packaging/rpm/forgum.spec | awk '{print $2}')
          if [ "$RPM_VER" != "$VERSION" ] && [ "$RPM_VER" != "$BASE_VER" ]; then
            echo "ERROR: RPM spec version ($RPM_VER) != Cargo.toml ($VERSION or $BASE_VER)"
            ERRORS=$((ERRORS + 1))
          fi

          # 4. Check DEB control
          DEB_VER=$(grep '^Version:' packaging/deb/DEBIAN/control | awk '{print $2}')
          if [ "$DEB_VER" != "$VERSION" ]; then
            echo "ERROR: DEB control version ($DEB_VER) != Cargo.toml ($VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          # 5. Check Chocolatey nuspec <version>
          CHOCO_VER=$(grep -m1 '<version>' packaging/choco/forgum.nuspec | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/' | tr -d '[:space:]')
          if [ "$CHOCO_VER" != "$VERSION" ]; then
            echo "ERROR: Chocolatey nuspec version ($CHOCO_VER) != Cargo.toml ($VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          # 6. Check Scoop manifest "version"
          SCOOP_VER=$(grep -m1 '"version"' packaging/scoop/forgum.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ "$SCOOP_VER" != "$VERSION" ]; then
            echo "ERROR: Scoop manifest version ($SCOOP_VER) != Cargo.toml ($VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          # 7. Check Arch PKGBUILD pkgver (pacman forbids hyphens in pkgver; normalized e.g. 0.0.1.alpha1)
          PKG_VER=$(grep '^pkgver=' packaging/pacman/PKGBUILD | cut -d= -f2 | tr -d '[:space:]')
          ARCH_NORM=$(echo "$VERSION" | tr '-' '.' | sed 's/\.alpha\./\.alpha/')
          if [ "$PKG_VER" != "$VERSION" ] && [ "$PKG_VER" != "$ARCH_NORM" ] && [ "$PKG_VER" != "$BASE_VER" ]; then
            echo "ERROR: PKGBUILD pkgver ($PKG_VER) != Cargo.toml ($VERSION or $ARCH_NORM)"
            ERRORS=$((ERRORS + 1))
          fi

          # 8. Check Gentoo ebuild PV (Gentoo PMS forbids hyphens in PV; normalized e.g. 0.0.1_alpha1)
          EBUILD_VER=$(basename packaging/gentoo/forgum-*.ebuild 2>/dev/null | sed -E 's/forgum-(.*)\.ebuild/\1/' | tr -d '[:space:]')
          GENTOO_NORM=$(echo "$VERSION" | sed -E 's/-alpha\.([0-9]+)/_alpha\1/' | sed -E 's/-beta\.([0-9]+)/_beta\1/' | sed -E 's/-rc\.([0-9]+)/_rc\1/')
          if [ -z "$EBUILD_VER" ]; then
            echo "ERROR: No ebuild found in packaging/gentoo/"
            ERRORS=$((ERRORS + 1))
          elif [ "$EBUILD_VER" != "$VERSION" ] && [ "$EBUILD_VER" != "$GENTOO_NORM" ] && [ "$EBUILD_VER" != "$BASE_VER" ]; then
            echo "ERROR: ebuild PV ($EBUILD_VER) != Cargo.toml ($VERSION or $GENTOO_NORM)"
            ERRORS=$((ERRORS + 1))
          fi

          # 9. Check Nix version (flake.nix and/or package.nix)
          NIX_FLAKE_VER=$(grep -m1 'version\s*=' packaging/nix/flake.nix 2>/dev/null | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
          NIX_PKG_VER=$(grep -m1 'version\s*=' packaging/nix/package.nix 2>/dev/null | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
          NIX_VER="${NIX_FLAKE_VER:-$NIX_PKG_VER}"
          if [ -z "$NIX_VER" ]; then
            echo "ERROR: No version found in packaging/nix/flake.nix or package.nix"
            ERRORS=$((ERRORS + 1))
          elif [ "$NIX_VER" != "$VERSION" ]; then
            echo "ERROR: Nix version ($NIX_VER) != Cargo.toml ($VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          # 10. Check MSI ProductVersion (Windows Installer requires numeric X.Y.Z ProductVersion; forgum.wxs uses base version)
          MSI_VER=$(grep 'Version="' packaging/windows/forgum.wxs 2>/dev/null | head -1 | sed -E 's/.*Version="([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ -z "$MSI_VER" ]; then
            echo "ERROR: No Version= found in packaging/windows/forgum.wxs"
            ERRORS=$((ERRORS + 1))
          elif [ "$MSI_VER" != "$VERSION" ] && [ "$MSI_VER" != "$BASE_VER" ]; then
            echo "ERROR: MSI ProductVersion ($MSI_VER) != Cargo.toml ($VERSION or $BASE_VER)"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "Version parity check failed with $ERRORS error(s)."
            exit 1
          fi
          echo "All 10 package manager manifests (Homebrew, Winget, RPM, DEB, Chocolatey, Scoop, Arch, Gentoo, Nix, MSI) verified successfully for version $VERSION ✓"

  contributor-standards-gate:
    name: Contributor Standards Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Zero-CFG containment
        run: cargo test -p forgum-engine --test cfg_containment
      - name: Strict <100MB RAM mandate
        run: cargo test -p forgum-engine --test memory_budget
      - name: Nature mathematics & occlusion integrity
        run: cargo test -p forgum-engine --test render_correctness
      - name: Resilient deserialization & DNA catalog protection
        run: cargo test -p forgum-engine --test dna_completeness
      - name: Universal shell delimiter excision & uninstall portability
        run: cargo test -p forgum-engine --test init_shell
      - name: Universal completion generation across all 15 shells
        run: cargo test -p forgum-engine --test completions
      - name: Nature mathematics unit tests
        run: cargo test -p forgum-engine --lib scenery::tests
      - name: Unified keyword mandate (user docs & shell hooks)
        run: |
          echo "=== Validating Unified Keyword Mandate ('forgum') ==="
          echo "1. Checking user documentation for forbidden 'forgum-engine' references..."
          DOC_HITS=$(grep -rn "forgum-engine" README.md docs/*.md || true)
          if [ -n "$DOC_HITS" ]; then
            echo "ERROR: 'forgum-engine' keyword detected in user documentation:"
            echo "$DOC_HITS"
            exit 1
          fi
          echo "User documentation strictly conforms to 'forgum' keyword ✓"

          echo "2. Checking shell hooks for forbidden 'forgum-engine' references..."
          for s in bash zsh fish pwsh cmd power-shell elvish nushell xonsh tcsh ksh ion oil yash; do
            HOOK=$(cargo run -q -p forgum-engine --bin forgum -- init "$s")
            # Verify hook generates successfully and does not leak 'forgum-engine'
            if echo "$HOOK" | grep -v "__FORGUM_ENGINE" | grep -i "forgum-engine"; then
              echo "ERROR: Generated hook for shell '$s' contains 'forgum-engine'"
              exit 1
            fi
          done
          echo "All 14 shell hook generators strictly conform to 'forgum' keyword ✓"

  # =====================================================================
  # Layer 2 — Integration (blocks merge)
  # =====================================================================

  shell-hooks:
    name: Shell hooks (${{ matrix.os }} / ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: ubuntu-latest
            shell: zsh
          - os: ubuntu-latest
            shell: fish
          - os: macos-14
            shell: bash
          - os: macos-14
            shell: zsh
          - os: macos-14
            shell: fish
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install shells (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh

      - name: Install shells (macos)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install fish || true

      - name: Build workspace
        run: cargo build --workspace

      - name: Bash hook
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          ENGINE_BIN=$(cargo metadata --format-version=1 --no-deps | python3 -c "import sys,json;print(json.load(sys.stdin)['target_directory'])" 2>/dev/null)/debug/forgum
          ENGINE_BIN="${ENGINE_BIN:-target/debug/forgum}"
          cargo run -q -p forgum-engine --bin forgum -- init bash > /tmp/forgum-bash.sh
          bash -c "source /tmp/forgum-bash.sh && type forgum && '$ENGINE_BIN' --version"

      - name: Zsh hook
        if: matrix.shell == 'zsh'
        shell: bash
        run: |
          ENGINE_BIN=$(cargo metadata --format-version=1 --no-deps | python3 -c "import sys,json;print(json.load(sys.stdin)['target_directory'])" 2>/dev/null)/debug/forgum
          ENGINE_BIN="${ENGINE_BIN:-target/debug/forgum}"
          cargo run -q -p forgum-engine --bin forgum -- init zsh > /tmp/forgum-zsh.zsh
          zsh -c "source /tmp/forgum-zsh.zsh && whence forgum && '$ENGINE_BIN' --version"

      - name: Fish hook
        if: matrix.shell == 'fish'
        shell: bash
        run: |
          ENGINE_BIN=$(cargo metadata --format-version=1 --no-deps | python3 -c "import sys,json;print(json.load(sys.stdin)['target_directory'])" 2>/dev/null)/debug/forgum
          ENGINE_BIN="${ENGINE_BIN:-target/debug/forgum}"
          cargo run -q -p forgum-engine --bin forgum -- init fish > /tmp/forgum-fish.fish
          fish -c "source /tmp/forgum-fish.fish; type forgum; '$ENGINE_BIN' --version"

      - name: PowerShell hook
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $bin = (cargo metadata --format-version=1 --no-deps | ConvertFrom-Json).target_directory + "\debug\forgum.exe"
          cargo run -q -p forgum-engine --bin forgum -- init pwsh | Out-File -Encoding ascii $env:TEMP/forgum-pwsh.ps1
          pwsh -NoProfile -Command "& { . $env:TEMP/forgum-pwsh.ps1; Get-Command forgum; & '$bin' --version }"

      - name: cmd hook
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          cargo run -q -p forgum-engine --bin forgum -- init cmd > "%TEMP%\forgum-cmd.cmd"
          findstr /i "sweep" "%TEMP%\forgum-cmd.cmd" >nul || exit /b 1
          call "%TEMP%\forgum-cmd.cmd"
          echo OK

  daemon-lifecycle:
    name: Daemon lifecycle (${{ matrix.os }})
    # TODO: wire once daemon CLI is stable; currently best-effort.
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Engine help
        run: cargo run -p forgum-engine --bin forgum -- --version
      - name: Forgum status
        run: cargo run -p forgum-engine --bin forgum -- status

  terminal-capabilities:
    name: Terminal capabilities
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace

      - name: Platform terminal unit tests (default TERM)
        run: cargo test -p forgum-platform terminal

      - name: Engine synchronized-update feature tests
        run: cargo test -p forgum-engine --features forgum-engine/synchronized-update

      - name: Platform sixel feature tests
        run: cargo test -p forgum-platform --features forgum-platform/sixel

      - name: Platform terminal tests under TERM=kitty
        env:
          TERM: kitty
          TERM_PROGRAM: kitty
        run: cargo test -p forgum-platform terminal

      - name: Platform terminal tests under TERM unset (conservative fallback)
        env:
          TERM: ""
        run: cargo test -p forgum-platform terminal

  ffmpeg-capture:
    name: ffmpeg animation capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build workspace
        run: cargo build --workspace
      - name: Run ffmpeg capture tests
        run: cargo test --test ffmpeg_capture -- --nocapture
      - name: Upload captured videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-captures
          path: test-renders/video/
          if-no-files-found: warn

  container-verification:
    name: Container Environments & Multi-Distro Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Contributor Dev Container (Dockerfile.dev)
        run: docker build -t forgum-dev:test -f Dockerfile.dev .

      - name: Verify Contributor Dev Container Toolchain & Helpers
        run: |
          docker run --rm forgum-dev:test bash -c \
            "rustc --version && cargo --version && zsh --version && fish --version && tmux -V && ffmpeg -version | head -n1 && test -x /usr/local/bin/forgum-check && test -x /usr/local/bin/forgum-build && test -x /usr/local/bin/forgum-test"

      - name: Multi-Distro Sandbox Test (Ubuntu)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace:ro ubuntu:latest bash -c \
            "apt-get update -qq && apt-get install -y -qq curl ca-certificates tar && bash /workspace/install.sh --headless && forgum doctor && forgum --animal cat --text 'Ubuntu Container Verified' --duration 1"

  # =====================================================================
  # Layer 3 — Packaging (blocks RELEASE only, NOT merge)
  # These run on push/PR to catch breakage early but are non-merge-blocking
  # here (continue-on-error: true). The release flow gates on them.
  # =====================================================================

  deb:
    name: Package deb
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build deb
        run: |
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh

  rpm:
    name: Package rpm
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build rpm
        run: |
          chmod +x packaging/rpm/build-rpm.sh
          ./packaging/rpm/build-rpm.sh

  msi:
    name: Package msi
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine
        run: cargo build --release -p forgum-engine --bin forgum
      - name: Install WiX
        # WiX install may fail on runner; non-fatal in L3.
        continue-on-error: true
        run: choco install wixtoolset -y
      - name: Build msi
        shell: bash
        run: |
          set -e
          BIN_DIR="$GITHUB_WORKSPACE/target/release"
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.11/bin"
          candle -dBinDir="$BIN_DIR" packaging/windows/forgum.wxs -o forgum.wixobj
          light forgum.wixobj -o packaging/windows/forgum.msi

  nix:
    name: Package nix
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Nix build
        run: nix build --no-link --print-out-paths ./packaging/nix

  pacman:
    name: Package pacman
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        run: pacman -Syu --noconfirm base-devel rust
      - name: Install build deps
        run: pacman -Syu --noconfirm base-devel
      - name: Build pacman package
        run: |
          chmod +x packaging/pacman/build-pacman.sh
          ./packaging/pacman/build-pacman.sh

  choco:
    name: Package choco
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nupkg
        shell: bash
        run: choco pack packaging/choco/forgum.nuspec --outputdirectory packaging/choco

  windows-pkg-validate:
    name: Validate Windows package manifests
    # L3: packaging — blocks RELEASE only; not merge-blocking here.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scoop (JSON), choco (XML), winget (YAML) manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Scoop: must be valid JSON with a non-empty version + windows zip URLs.
          $scoop = Get-Content packaging/scoop/forgum.json -Raw | ConvertFrom-Json
          if (-not $scoop.version) { throw "scoop manifest missing version" }
          if (-not $scoop.architecture.'64bit'.url.EndsWith('.zip')) { throw "scoop 64bit url invalid" }
          if (-not $scoop.architecture.arm64.url.EndsWith('.zip')) { throw "scoop arm64 url invalid" }
          Write-Host "scoop manifest OK (v$($scoop.version))"

          # Choco: nuspec must be well-formed XML and carry a version.
          [xml]$nuspec = Get-Content packaging/choco/forgum.nuspec
          $cv = $nuspec.package.metadata.version
          if (-not $cv) { throw "choco nuspec missing <version>" }
          Write-Host "choco nuspec OK (v$cv)"

          # Winget: parse the multi-document YAML and confirm PackageVersion + installer URLs.
          $raw = Get-Content packaging/winget/HKDevLoops.Forgum.yaml -Raw
          $docs = $raw -split '(?m)^---+\s*$' | Where-Object { $_.Trim().Length -gt 0 }
          $installer = $docs | Where-Object { $_ -match 'ManifestType:\s*installer' }
          if (-not $installer) { throw "winget installer document not found" }
          $ver = $scoop.version
          if ($installer -notmatch "forgum-$ver-windows-(x64|arm64)\.zip") { throw "winget installer url invalid" }
          Write-Host "winget manifest OK"

          Write-Host "All Windows package manifests validated."
