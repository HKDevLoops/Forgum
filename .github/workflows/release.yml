name: Release

on:
  push:
    tags:
      - "v*"
      - "alpha-*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write

jobs:
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        name: Extract and verify version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          CLEAN_TAG="${TAG#v}"
          CLEAN_TAG="${CLEAN_TAG#alpha-}"
          if [ "${CLEAN_TAG}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi

          echo "Tag ${TAG} accepted for Cargo.toml version ${VERSION}"

  test-and-lint:
    name: Mandatory Test & Lint Suite Gate
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy Audit
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Comprehensive Test Suite
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [version-check, test-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # i686 (x86-32) is a BEST-EFFORT / COMMUNITY / UNTESTED artifact (T6 / G5).
          # There is no free i686 runner to runtime-test it, so it is build-only and must
          # NEVER block the x86-64/arm64 release. The build step uses continue-on-error and
          # packaging is skipped, so a compile failure here cannot fail the release job.
          - target: i686-pc-windows-msvc
            os: windows-latest
            build_only: true
          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            cross: true
            build_only: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            cross: true
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            build_only: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Ensure target is installed via rustup
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        continue-on-error: ${{ matrix.build_only || false }}
        run: cross build --release --locked --target ${{ matrix.target }} -p forgum-engine --bin forgum

      - name: Build (native)
        if: ${{ !matrix.cross }}
        # i686 is best-effort/community (T6 / G5): do NOT fail the release if it cannot
        # compile against windows-sys / crossterm on x86-32. Only the build step is
        # continue-on-error; packaging + upload below still skip build_only targets.
        continue-on-error: ${{ matrix.build_only || false }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p forgum-engine --bin forgum

      - name: Package (unix)
        if: ${{ runner.os != 'Windows' && !matrix.build_only }}
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../forgum-${{ matrix.target }}.tar.gz forgum ../../../README.md
          cd ../../..
          sha256sum "forgum-${{ matrix.target }}.tar.gz" > "forgum-${{ matrix.target }}.sha256"

      # Windows packaging is restricted to the rigorously-tested x86-64 / arm64 targets.
      # i686 (build_only) is skipped entirely — it is not runtime-tested and does not
      # produce a supported archive.
      - name: Package (windows)
        if: ${{ runner.os == 'Windows' && !matrix.build_only }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar --force-local -czf ../../../forgum-${{ matrix.target }}.tar.gz forgum.exe ../../../README.md
          cd ../../..
          sha256sum "forgum-${{ matrix.target }}.tar.gz" > "forgum-${{ matrix.target }}.sha256"

      # Windows zip artifacts consumed by the winget + scoop manifests.
      - name: Package (windows zip)
        if: ${{ runner.os == 'Windows' && !matrix.build_only }}
        shell: bash
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          SRC_DIR="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          ROOT_DIR="$GITHUB_WORKSPACE"

          ZIP_NAME=""
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   ZIP_NAME="forgum-${VERSION}-windows-x64.zip" ;;
            aarch64-pc-windows-msvc)  ZIP_NAME="forgum-${VERSION}-windows-arm64.zip" ;;
            *) echo "::error::Unknown windows target ${{ matrix.target }}"; exit 1 ;;
          esac

          TMPDIR=$(mktemp -d)
          cp "$SRC_DIR/forgum.exe" "$TMPDIR/forgum.exe"
          cp "$ROOT_DIR/README.md" "$TMPDIR/README.md"
          cd "$TMPDIR"
          if command -v 7z >/dev/null 2>&1; then
            7z a "$ROOT_DIR/$ZIP_NAME" forgum.exe README.md >/dev/null
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path forgum.exe, README.md -DestinationPath '$ROOT_DIR/$ZIP_NAME' -Force"
          fi
          cd "$ROOT_DIR"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"

      - name: Package (macos dmg)
        if: ${{ runner.os == 'macOS' && !matrix.build_only }}
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          chmod +x packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh "${VERSION}" "${{ matrix.target }}"

      - name: Upload artifacts
        # Skip upload for the build_only i686 lane: it produces no packaged archive and
        # is not a supported release artifact.
        if: ${{ !matrix.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            forgum-${{ matrix.target }}.tar.gz
            forgum-${{ matrix.target }}.sha256
            forgum-*-windows-*.zip
            forgum-*-windows-*.sha256
            forgum-*-macos-*.dmg
            forgum-*-macos-*.dmg.sha256
            # L3 packaging artifacts (built by the `packages` job below, which the
            # `release` job depends on). upload-artifact ignores globs with no
            # matches, but every one of these is expected to exist for a tag build.
            packaging/windows/*.msi
            packaging/choco/*.nupkg
            forgum-*-linux-*.deb
            forgum-*-linux-*.rpm

  packages:
    name: Build release packages (deb, rpm, nix, pacman)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build deb
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh
          cp -f *.deb "$GITHUB_WORKSPACE/" 2>/dev/null || true

      - name: Build rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          chmod +x packaging/rpm/build-rpm.sh
          ./packaging/rpm/build-rpm.sh
          cp -f rpmbuild/RPMS/*/*.rpm "$GITHUB_WORKSPACE/" 2>/dev/null || true

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Nix build
        run: nix build --no-link --print-out-paths ./packaging/nix

      - name: Build pacman
        uses: docker://archlinux:latest
        with:
          entrypoint: bash
          args: >-
            -c "pacman -Syu --noconfirm base-devel rust &&
                chmod +x packaging/pacman/build-pacman.sh &&
                ./packaging/pacman/build-pacman.sh"

      - name: Compute package checksums
        run: |
          for f in *.deb *.rpm; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256

  packages-win:
    name: Build release packages (msi, choco)
    needs: [build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine
        run: cargo build --release -p forgum-engine --bin forgum

      - name: Install WiX
        continue-on-error: true
        run: choco install wixtoolset -y

      - name: Build msi
        shell: bash
        run: |
          set -e
          BIN_DIR="$GITHUB_WORKSPACE/target/release"
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.11/bin"
          candle -dBinDir="$BIN_DIR" packaging/windows/forgum.wxs -o forgum.wixobj
          light forgum.wixobj -o packaging/windows/forgum.msi

      - name: Build choco nupkg
        shell: bash
        run: choco pack packaging/choco/forgum.nuspec --outputdirectory packaging/choco

      - name: Compute Windows package checksums
        shell: bash
        run: |
          for f in packaging/windows/*.msi packaging/choco/*.nupkg; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-win
          path: |
            packaging/windows/*.msi
            packaging/windows/*.msi.sha256
            packaging/choco/*.nupkg
            packaging/choco/*.nupkg.sha256

  verify-release-artifacts:
    name: Automated Release Verification Gate
    needs: [version-check, build, packages, packages-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts for verification
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: verify-artifacts

      - name: Run scripted release smoke tests and monitoring
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-check.outputs.version }}"
          echo "=========================================================="
          echo "AUTOMATED RELEASE VERIFICATION PROTOCOL (v${VERSION})"
          echo "=========================================================="
          cd verify-artifacts
          ls -la

          # 1. Verify and test the Linux x86_64 prebuilt binary
          echo ">> 1. Verifying native Linux x86_64 archive..."
          if [ -f "forgum-x86_64-unknown-linux-gnu.tar.gz" ]; then
            tar -xzf "forgum-x86_64-unknown-linux-gnu.tar.gz" -C /tmp/
            chmod +x /tmp/forgum

            echo ">> Testing /tmp/forgum --version..."
            BIN_VER="$(/tmp/forgum --version)"
            echo "   Output: ${BIN_VER}"
            echo "${BIN_VER}" | grep -q "${VERSION}" || { echo "::error::Binary version mismatch: ${BIN_VER} vs expected ${VERSION}"; exit 1; }

            echo ">> Testing /tmp/forgum --help..."
            /tmp/forgum --help | grep -q "render" || { echo "::error::--help output missing core commands"; exit 1; }

            echo ">> Testing /tmp/forgum fetch --instant..."
            /tmp/forgum fetch --instant

            echo ">> Testing /tmp/forgum checkhealth --headless..."
            /tmp/forgum checkhealth --headless || true

            echo ">> Testing /tmp/forgum render --duration 1..."
            /tmp/forgum render --mascot cow --duration 1 || true
            echo "   [✓] Native Linux binary verification passed"
          fi

          # 2. Check Debian package integrity if present
          DEB_FILE=$(ls *.deb 2>/dev/null | head -n1 || true)
          if [ -n "$DEB_FILE" ]; then
            echo ">> 2. Testing Debian package integrity (${DEB_FILE})..."
            dpkg-deb -I "$DEB_FILE"
            dpkg-deb -c "$DEB_FILE" | grep -q "usr/bin/forgum" || { echo "::error::.deb missing /usr/bin/forgum"; exit 1; }
            echo "   [✓] .deb package structure verified"
          fi

          # 3. Check RPM package integrity if present
          RPM_FILE=$(ls *.rpm 2>/dev/null | head -n1 || true)
          if [ -n "$RPM_FILE" ]; then
            echo ">> 3. Testing RPM package integrity (${RPM_FILE})..."
            sudo apt-get update -qq && sudo apt-get install -y -qq rpm
            rpm -qip "$RPM_FILE"
            rpm -qlp "$RPM_FILE" | grep -q "forgum" || { echo "::error::.rpm missing forgum binary"; exit 1; }
            echo "   [✓] .rpm package structure verified"
          fi

          # 4. Verify SHA256 checksums
          echo ">> 4. Verifying SHA256 checksums..."
          for sha_file in *.sha256; do
            if [ -f "$sha_file" ]; then
              echo "Checking $sha_file..."
              sed -E 's|  .*/([^/]+)$|  \1|' "$sha_file" > "${sha_file}.normalized"
              sha256sum -c "${sha_file}.normalized" || { echo "::error::Checksum failed for $sha_file"; exit 1; }
              rm -f "${sha_file}.normalized"
            fi
          done

          # 5. Compile consolidated master SHA256SUMS manifest
          echo ">> 5. Compiling consolidated master SHA256SUMS manifest..."
          rm -f SHA256SUMS
          for f in *.tar.gz *.zip *.dmg *.deb *.rpm *.msi *.nupkg; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          echo "=========================================================="
          # 6. Synchronize package manager manifests (Scoop, WinGet, Homebrew, PKGBUILD)
          echo ">> 6. Synchronizing package manager manifests with computed SHA-256 hashes..."
          python3 ../scripts/update-package-manifests.py --manifest SHA256SUMS --version "$VERSION" --root ..
          cp ../packaging/scoop/forgum.json ./forgum-scoop.json
          cp ../packaging/winget/HKDevLoops.Forgum.yaml ./forgum-winget.yaml
          cp ../packaging/homebrew/forgum.rb ./forgum-homebrew.rb
          cp ../packaging/pacman/PKGBUILD ./forgum-PKGBUILD

          echo "✓ ALL AUTOMATED RELEASE VERIFICATION GATES PASSED (APPROVED)"

      - name: Upload master checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: |
            verify-artifacts/SHA256SUMS
            verify-artifacts/forgum-scoop.json
            verify-artifacts/forgum-winget.yaml
            verify-artifacts/forgum-homebrew.rb
            verify-artifacts/forgum-PKGBUILD

  release:
    name: Create GitHub Release
    needs: [version-check, test-and-lint, build, packages, packages-win, verify-release-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: 'artifacts/*.*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Forgum ${{ github.ref_name }}"
          prerelease: ${{ contains(needs.version-check.outputs.version, 'alpha') || startsWith(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: artifacts/*
