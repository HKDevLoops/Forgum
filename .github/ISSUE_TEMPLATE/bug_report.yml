name: "🐛 Bug Report"
description: "Submit a structured bug report to help improve Forgum."
title: "fix: "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Forgum!
        Please fill out this form completely. High-quality bug reports allow maintainers to diagnose, reproduce, and fix issues swiftly.

  - type: dropdown
    id: release-channel
    attributes:
      label: Release Channel / Branch
      description: Which channel are you running?
      options:
        - "main (Stable release)"
        - "nightly (Early access release)"
        - "dev (Maintainer / developer branch)"
        - "Custom / Local build"
    validations:
      required: true

  - type: dropdown
    id: install-source
    attributes:
      label: Installation Source
      description: How did you install Forgum?
      options:
        - "Standalone install script (install.ps1 / install.sh)"
        - "Scoop (Windows)"
        - "Homebrew (macOS / Linux)"
        - "WinGet (Windows)"
        - "Chocolatey (Windows)"
        - "AUR / Pacman (Arch Linux)"
        - "Debian / Ubuntu (.deb / APT)"
        - "Fedora / RHEL (.rpm / DNF)"
        - "Nix / Flake"
        - "Cargo (cargo install)"
        - "Manual binary download"
    validations:
      required: true

  - type: input
    id: forgum-version
    attributes:
      label: Forgum Version
      description: Run `forgum --version` in your terminal and paste the output.
      placeholder: "forgum 0.0.1-alpha.1 (or similar)"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System & Terminal Emulator
      description: E.g., Windows 11 / Windows Terminal 1.20, macOS Sonoma / WezTerm, Ubuntu 24.04 / Alacritty.
      placeholder: "OS: Windows 11 Enterprise | Terminal: Windows Terminal | Shell: pwsh 7.4"
    validations:
      required: true

  - type: textarea
    id: health-check
    attributes:
      label: Health Check Diagnostics (`forgum checkhealth`)
      description: Paste the output of `forgum checkhealth` (or `forgum status`).
      render: text
    validations:
      required: false

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: Exact commands executed to trigger the bug.
      placeholder: |
        1. Run `forgum --animal dragon --effect breathe`
        2. Resize terminal to 80x24
        3. Observe terminal glitch
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: checkboxes
    id: standards-check
    attributes:
      label: Pre-Submission Flight Check
      options:
        - label: "I have confirmed this bug reproduces on the latest release of my chosen channel."
          required: true
        - label: "I searched existing issues and confirmed this is not a duplicate."
          required: true
        - label: "I tested in a clean terminal without conflicting third-party prompts if applicable."
          required: false
