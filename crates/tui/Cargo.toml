[package]
name = "forgum-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Interactive TUI config editor for Forgum's terminal animation engine. Built on ratatui & crossterm — theme picker, mascot selector, scene settings."
repository.workspace = true
readme = "../../README.md"
keywords = ["tui", "ratatui", "terminal-ui", "config", "crossterm"]
categories = ["command-line-interface", "config"]

[dependencies]
forgum-platform = { path = "../platform" }
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1"

[lints]
workspace = true
